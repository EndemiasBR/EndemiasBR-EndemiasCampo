<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EndemiasCampo</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#006B3F">
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f0fff4; }
    header { background: linear-gradient(135deg, #006B3F, #009C3B); color: #fff; padding: 16px; border-bottom: 6px solid #FFD700; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 6px 0 0; color: #FFD700; font-size: 14px; }
    main { padding: 14px; max-width: 760px; margin: 0 auto; }
    .card { background: #fff; border: 1px solid #c8e6d0; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button { width: 100%; height: 46px; border: 0; border-radius: 9px; background: #008f36; color: #fff; font-weight: 700; font-size: 15px; }
    .btn-sec { background: #0b6b3a; }
    .btn-back { background: #5a7a64; margin-bottom: 10px; }
    label { display: block; font-weight: 700; color: #006B3F; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #b7d9c2; border-radius: 8px; font-size: 16px; }
    .chk { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 15px; }
    .chk input { width: auto; }
    .item { border-top: 1px solid #e0eee4; padding: 8px 0; font-size: 14px; }
    .pendente { color: #9a6b00; font-weight: 700; }
    .enviado { color: #006B3F; font-weight: 700; }
    .hide { display: none; }
    .sug { border: 1px solid #b7d9c2; border-radius: 8px; max-height: 220px; overflow: auto; background: #fff; }
    .sug div { padding: 10px; border-bottom: 1px solid #eef6f0; }
    .sug div:active, .sug div:hover { background: #e8f7ee; }
  </style>
</head>
<body>
  <header>
    <h1>EndemiasCampo</h1>
    <p id="subtitulo">Programas de campo</p>
  </header>
  <main>
    <div id="tela-home">
      <div class="card">
        <div id="rede">Verificando rede...</div>
        <p>Escolha o programa. O Diário PCDCh vai para a mesma ficha da cidade.</p>
        <div class="grid">
          <button onclick="abrirPrograma('SISLOC')">SISLOC</button>
          <button onclick="abrirPrograma('PCDCh')">PCDCh</button>
          <button onclick="abrirPrograma('PCE')">PCE</button>
          <button onclick="abrirPrograma('PCL')">PCL</button>
        </div>
      </div>
      <div class="card">
        <strong>Registros neste aparelho</strong>
        <div id="lista"></div>
        <button class="btn-sec" onclick="sincronizar(true)">Sincronizar agora</button>
      </div>
    </div>
    <div id="tela-programa" class="hide">
      <button class="btn-back" onclick="irHome()">Voltar</button>
      <div class="card" id="botoes-atividades"></div>
    </div>
    <div id="tela-ficha" class="hide">
      <button class="btn-back" onclick="voltarPrograma()">Voltar</button>
      <div class="card" id="corpo-ficha"></div>
    </div>
  </main>
  <script>
    const CHAVE = "endemiascampo_diario";
    const CACHE_MUN = "endemiascampo_municipios";
    const CACHE_LOC = "endemiascampo_localidades";
    const SUPABASE_URL = "https://gwperarqwoflsmowaxgs.supabase.co";
    const SUPABASE_KEY = "sb_publishable_L66WTnc3iZYDb1TTmcHg0A_o-2Ec8Fm";
    let programaAtual = "";
    let fichaAtual = "";

    const ATIVIDADES = {
      SISLOC: ["Localidade", "Imóvel"],
      PCDCh: ["Diário PCDCh", "Imóvel / vistoria", "Pesquisa entomológica", "Captura", "Triatomíneo", "Exame", "PIT", "Notificação", "Educação em saúde"],
      PCE: ["Coleção hídrica", "Pesquisa malacológica", "PCE-101", "PCE-108 / exame", "Educação em saúde", "Saneamento"],
      PCL: ["Caso humano", "Investigação", "Entomologia", "Inquérito canino", "Ação / pulverização", "Óbito", "Educação em saúde"]
    };

    function headers() {
      return {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      };
    }
    function online() { return navigator.onLine; }
    function mostrarRede() {
      const el = document.getElementById("rede");
      if (el) el.textContent = online() ? "Com sinal — pendentes serão enviados." : "Sem sinal — salvando só neste aparelho.";
    }
    function ler() { try { return JSON.parse(localStorage.getItem(CHAVE) || "[]"); } catch { return []; } }
    function gravar(d) { localStorage.setItem(CHAVE, JSON.stringify(d)); }
    function lerJson(k) { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; } }

    function mostrar() {
      const lista = document.getElementById("lista");
      const dados = ler();
      if (!dados.length) { lista.innerHTML = "<p>Nenhum registro ainda.</p>"; return; }
      lista.innerHTML = dados.map(r =>
        `<div class="item">
          <div><b>${r.programa || "PCDCh"}</b> — ${r.atividade}</div>
          <div>${r.data} — ${r.municipio || ""} / ${r.localidade || "-"}</div>
          <div class="${r.status === "enviado" ? "enviado" : "pendente"}">${r.status === "enviado" ? "Enviado ao banco" : "Pendente de sincronizar"}</div>
        </div>`
      ).join("");
    }

    async function baixarListas() {
      if (!online() || !SUPABASE_KEY || SUPABASE_KEY.indexOf("COLE_AQUI") >= 0) return;
      const h = headers();
      const r1 = await fetch(SUPABASE_URL + "/rest/v1/municipios?select=id,nome&order=nome", { headers: h });
      if (r1.ok) localStorage.setItem(CACHE_MUN, JSON.stringify(await r1.json()));
      const r2 = await fetch(SUPABASE_URL + "/rest/v1/localidades?select=id,nome,municipio_id&order=nome", { headers: h });
      if (r2.ok) localStorage.setItem(CACHE_LOC, JSON.stringify(await r2.json()));
    }

    function nomePorId(lista, id) {
      const x = lista.find(i => String(i.id) === String(id));
      return x ? x.nome : "";
    }
    function normaliza(s) {
      return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }
    function htmlBusca(tipo) {
      const ph = tipo === "mun" ? "Digite o município" : "Digite a localidade";
      return `<input id="${tipo}_busca" placeholder="${ph}" autocomplete="off" oninput="filtrarBusca('${tipo}')">
        <input type="hidden" id="${tipo === "mun" ? "municipio_id" : "localidade_id"}">
        <div id="${tipo}_sug" class="sug hide"></div>`;
    }
    function filtrarBusca(tipo) {
      const q = normaliza(document.getElementById(tipo + "_busca").value);
      const box = document.getElementById(tipo + "_sug");
      if (tipo === "mun") document.getElementById("municipio_id").value = "";
      else document.getElementById("localidade_id").value = "";
      if (q.length < 2) { box.classList.add("hide"); box.innerHTML = ""; return; }
      let itens = [];
      if (tipo === "mun") {
        itens = lerJson(CACHE_MUN).filter(m => normaliza(m.nome).includes(q)).slice(0, 30);
      } else {
        const mid = document.getElementById("municipio_id").value;
        itens = lerJson(CACHE_LOC).filter(l =>
          (!mid || String(l.municipio_id) === String(mid)) && normaliza(l.nome).includes(q)
        ).slice(0, 30);
      }
      if (!itens.length) { box.classList.remove("hide"); box.innerHTML = "<div>Nenhum resultado</div>"; return; }
      box.classList.remove("hide");
      box.innerHTML = itens.map(i =>
        `<div onclick="escolherBusca('${tipo}', '${i.id}', \`${String(i.nome).replace(/`/g, "")}\`)">${i.nome}</div>`
      ).join("");
    }
    function escolherBusca(tipo, id, nome) {
      document.getElementById(tipo + "_busca").value = nome;
      document.getElementById(tipo + "_sug").classList.add("hide");
      if (tipo === "mun") {
        document.getElementById("municipio_id").value = id;
        document.getElementById("loc_busca").value = "";
        document.getElementById("localidade_id").value = "";
      } else {
        document.getElementById("localidade_id").value = id;
      }
    }

    function mostrarSo(id) {
      ["tela-home","tela-programa","tela-ficha"].forEach(t => {
        document.getElementById(t).classList.toggle("hide", t !== id);
      });
    }
    function irHome() {
      mostrarSo("tela-home");
      document.getElementById("subtitulo").textContent = "Programas de campo";
      mostrarRede(); mostrar();
    }
    function abrirPrograma(p) {
      programaAtual = p;
      document.getElementById("subtitulo").textContent = p;
      document.getElementById("botoes-atividades").innerHTML =
        "<p>Atividades de campo</p>" +
        ATIVIDADES[p].map(a => `<button style="margin-top:8px" onclick='abrirFicha(${JSON.stringify(p)}, ${JSON.stringify(a)})'>${a}</button>`).join("");
      mostrarSo("tela-programa");
    }
    function voltarPrograma() { abrirPrograma(programaAtual); }

    function abrirFicha(programa, ficha) {
      programaAtual = programa; fichaAtual = ficha;
      document.getElementById("subtitulo").textContent = programa + " — " + ficha;
      document.getElementById("corpo-ficha").innerHTML = ficha === "Diário PCDCh" ? htmlDiario() : htmlGenerica(programa, ficha);
      const dt = document.getElementById("data");
      if (dt) dt.value = new Date().toISOString().slice(0, 10);
      mostrarSo("tela-ficha");
    }

    function htmlGenerica(programa, ficha) {
      return `
        <label>Data</label><input type="date" id="data">
        <label>Município</label>${htmlBusca("mun")}
        <label>Localidade</label>${htmlBusca("loc")}
        <label>Observações</label><textarea id="obs" rows="3"></textarea>
        <button onclick="salvarGenerica()">Salvar ${ficha}</button>
        <p style="font-size:13px;color:#555">Ficha de ${programa}. Destino oficial desta atividade entra na sequência.</p>`;
    }

    function htmlDiario() {
      return `
        <label>Data da atividade</label><input type="date" id="data">
        <label>Município</label>${htmlBusca("mun")}
        <label>Localidade</label>${htmlBusca("loc")}
        <label>Categoria</label><select id="categoria"><option>Urbana</option><option>Rural</option></select>
        <label>Quarteirão</label><input id="quarteirao">
        <label>Casa</label><input id="casa">
        <label>Complemento</label><input id="complemento">
        <label class="chk"><input type="checkbox" id="faz_pesquisa"> Pesquisa</label>
        <label class="chk"><input type="checkbox" id="faz_borrifacao"> Borrifação</label>
        <label class="chk"><input type="checkbox" id="faz_pit"> PIT</label>
        <label>Situação do imóvel</label>
        <select id="situacao_imovel"><option>Ocupado</option><option>Fechado</option><option>Desabitado</option><option>Recusa</option></select>
        <label>Tipo de parede</label><input id="tipo_parede">
        <label>Tipo de teto</label><input id="tipo_teto">
        <label>Habitantes</label><input id="habitantes" type="number" value="0">
        <label>Anexos</label><input id="anexos" type="number" value="0">
        <label>Morador colaborador</label><input id="morador">
        <label class="chk"><input type="checkbox" id="captura_intra"> Captura intradomiciliar</label>
        <label class="chk"><input type="checkbox" id="vestigios_intra"> Vestígios intra</label>
        <label class="chk"><input type="checkbox" id="captura_peri"> Captura peridomiciliar</label>
        <label class="chk"><input type="checkbox" id="vestigios_peri"> Vestígios peri</label>
        <label>Inseticida</label><input id="inseticida">
        <label>Qtde inseticida</label><input id="qtde_inseticida" type="number" value="0">
        <label>Nº PIT</label><input id="num_pit">
        <label>Notificação</label><input id="notificacao">
        <label>Agente</label><input id="agente_saude">
        <label>Etiqueta</label><input id="etiqueta">
        <label>Observações</label><textarea id="obs" rows="2"></textarea>
        <button onclick="salvarDiario()">Salvar Diário PCDCh</button>`;
    }

    function val(id) { const e = document.getElementById(id); return e ? e.value.trim() : ""; }
    function chk(id) { const e = document.getElementById(id); return !!(e && e.checked); }
    function num(id) { const n = parseInt(val(id) || "0", 10); return isNaN(n) ? 0 : n; }

    function salvarRegistro(registro) {
      if (!registro.data || !registro.municipio_id) { alert("Selecione data e município da lista oficial."); return; }
      const dados = ler();
      dados.unshift(registro);
      gravar(dados);
      if (online()) sincronizar(false);
      else alert("Salvo neste aparelho. Envia quando o sinal voltar.");
      irHome();
    }

    function salvarGenerica() {
      salvarRegistro({
        id: Date.now(), programa: programaAtual, atividade: fichaAtual,
        data: val("data"),
        municipio_id: val("municipio_id"),
        localidade_id: val("localidade_id"),
        municipio: nomePorId(lerJson(CACHE_MUN), val("municipio_id")),
        localidade: nomePorId(lerJson(CACHE_LOC), val("localidade_id")),
        obs: val("obs"), status: "pendente"
      });
    }

    function salvarDiario() {
      if (!chk("faz_pesquisa") && !chk("faz_borrifacao") && !chk("faz_pit")) {
        alert("Marque Pesquisa, Borrifação ou PIT."); return;
      }
      salvarRegistro({
        id: Date.now(), programa: "PCDCh", atividade: "Diário PCDCh",
        data: val("data"),
        municipio_id: val("municipio_id"),
        localidade_id: val("localidade_id"),
        municipio: nomePorId(lerJson(CACHE_MUN), val("municipio_id")),
        localidade: nomePorId(lerJson(CACHE_LOC), val("localidade_id")),
        categoria: val("categoria"), quarteirao: val("quarteirao"), casa: val("casa"),
        complemento: val("complemento"), situacao_imovel: val("situacao_imovel"),
        tipo_parede: val("tipo_parede"), tipo_teto: val("tipo_teto"),
        habitantes: num("habitantes"), anexos: num("anexos"), morador: val("morador"),
        faz_pesquisa: chk("faz_pesquisa"), faz_borrifacao: chk("faz_borrifacao"), faz_pit: chk("faz_pit"),
        captura_intra: chk("captura_intra"), vestigios_intra: chk("vestigios_intra"),
        captura_peri: chk("captura_peri"), vestigios_peri: chk("vestigios_peri"),
        inseticida: val("inseticida"), qtde_inseticida: num("qtde_inseticida"),
        num_pit: val("num_pit"), notificacao: val("notificacao"),
        agente_saude: val("agente_saude"), etiqueta: val("etiqueta"),
        obs: val("obs"), status: "pendente"
      });
    }

    async function postJson(tabela, corpo) {
      const resp = await fetch(SUPABASE_URL + "/rest/v1/" + tabela, {
        method: "POST",
        headers: Object.assign(headers(), { "Prefer": "return=minimal" }),
        body: JSON.stringify(corpo)
      });
      if (!resp.ok) throw new Error(await resp.text() || ("HTTP " + resp.status));
    }

    async function enviarUm(r) {
      if (r.atividade === "Diário PCDCh" && r.municipio_id) {
        await postJson("diario_pcdch", {
          data_atividade: r.data || null,
          municipio_id: Number(r.municipio_id),
          localidade_id: r.localidade_id ? Number(r.localidade_id) : null,
          categoria: r.categoria || null,
          quarteirao: r.quarteirao || null,
          casa: r.casa || null,
          complemento: r.complemento || null,
          morador_colaborador: r.morador || null,
          habitantes: r.habitantes || 0,
          anexos: r.anexos || 0,
          tipo_parede: r.tipo_parede || null,
          tipo_teto: r.tipo_teto || null,
          situacao_imovel: r.situacao_imovel || null,
          faz_pesquisa: !!r.faz_pesquisa,
          faz_borrifacao: !!r.faz_borrifacao,
          faz_pit: !!r.faz_pit,
          captura_intra: !!r.captura_intra,
          vestigios_intra: !!r.vestigios_intra,
          captura_peri: !!r.captura_peri,
          vestigios_peri: !!r.vestigios_peri,
          inseticida: r.inseticida || null,
          qtde_inseticida: r.qtde_inseticida || 0,
          num_pit: r.num_pit || null,
          notificacao: r.notificacao || null,
          agente_saude: r.agente_saude || null,
          etiqueta: r.etiqueta || null,
          status: "Ativo"
        });
      }
      await postJson("endemiascampo_diario", {
        origem_id: r.id,
        data: r.data || null,
        municipio: r.municipio || null,
        localidade: r.localidade || null,
        atividade: (r.programa ? r.programa + " — " : "") + (r.atividade || ""),
        observacao: r.obs || null,
        status: "importado"
      });
    }

    async function sincronizar(avisar) {
      if (!SUPABASE_KEY || SUPABASE_KEY.indexOf("COLE_AQUI") >= 0) { alert("Cole a chave pública."); return; }
      if (!online()) { if (avisar) alert("Sem internet agora."); return; }
      await baixarListas();
      const dados = ler();
      const pendentes = dados.filter(x => x.status === "pendente");
      if (!pendentes.length) { if (avisar) alert("Não há pendentes."); return; }
      let ok = 0, erro = "";
      for (const r of pendentes) {
        try { await enviarUm(r); r.status = "enviado"; ok += 1; }
        catch (e) { erro = String(e.message || e); break; }
      }
      gravar(dados); mostrar();
      if (erro) alert("Falha ao enviar: " + erro);
      else if (avisar || ok) alert(ok + " registro(s) enviado(s) ao banco.");
    }

    mostrarRede(); mostrar();
    baixarListas();
    window.addEventListener("online", () => { mostrarRede(); baixarListas(); sincronizar(false); });
    window.addEventListener("offline", mostrarRede);
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
